{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>register</title>
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>
<body>

    

    <div class="container-fluid">
        <div class="row vh-100">
     
            <div class="col-12 col-lg-6 m-auto m-lg-0 bg-dark text-light border-end ">
                <form action="{% url 'register' %}" method="post" onsubmit="return checkPassword()">
                    {% csrf_token %}
                    <h1>Sign up:</h1>
    
                    {% if messages %}
                        
                            
                        {% for message in messages %}
                            <div class="{{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                                
                        
                    {% endif %}
                    <div class="row">
                        

                            <div class="mb-3 col-6 ">
                                <label class="form-label" for="firstname">First Name :</label>
                                <input class="form-control" type="text" name="firstname" id="firstname" placeholder="enter first-name">
                            </div>
                            <div class="mb-3 col-6">
                                <label class="form-label" for="lastname">Last Name :</label>
                                <input class="form-control" type="text" name="lastname" id="lastname" placeholder="enter last-name">
                            </div>

                        
                    </div>

                   
    
                    <div class="mb-3">
                        <label class="form-label" for="email">Email :</label>
                        <input class="form-control" type="email" name="email" id="email" placeholder="enter email">
                    </div>
    
                    <div class="mb-3">
                        <label class="form-label" for="username">Username :</label>
                        <input class="form-control" type="text" name="username" id="username" placeholder="enter username">
                    </div>
    
                    <div class="mb-3">
                        <label class="form-label" for="password">Password :</label>
                        <input class="form-control" type="password" name="password" id="password" placeholder="enter password" onkeyup="check_password()">
                    </div>
    
                    <div class="mb-3">
                        <label class="form-label" for="password2">Confirm Your Password :</label>
                        <input class="form-control" type="password" name="password2" id="password2" placeholder="confirm password" onkeyup="check_password()">
                    </div>

                    <div class="alert alert-danger" id="alertpassword">
                        <p class="m-0" id="alert_message"></p>
                    </div>

                    <div class="mb-3">
                        <button class="btn btn-primary" type="submit" id="submit">Create account</button>
                    </div>
    
                    <div>
                        <p>
                            you already have an account <a href="{% url 'login' %}">click here to sign in</a>
                        </p>
                    </div>
                </form>
            </div>

            <div class="d-lg-flex d-none col-6 m-0 p-0 bg-dark text-dark justify-content-center align-items-center ">
                <div class="border border-light rounded-5 p-4 border-2 w-50 bg-light">
                    <p class="display-6">"Reading is important. If you know how to read, then the whole world opens up to you." <h2>– Barack Obama</h2><p>
                </div>
            </div>
     
        </div>
    </div>



    <script>

        const password1 = document.getElementById("password");
        const password2 = document.getElementById("password2");
        const alertpassword = document.getElementById("alertpassword");
        alertpassword.style.display = 'none';
        const alert_message = document.getElementById("alert_message");
        alert_message.innerHTML = 'asdasdas';
        const submit_button = document.getElementById("submit");
      
        function check_password(){
          if(password1.value == "" && password2.value == ""){
            alert_message.innerHTML = "Silahkan masukkan password";
            alertpassword.style.display = 'block';
            submit_button.disabled = true
          } else if(password1.value != password2.value){
            alert_message.innerHTML = "Password tidak sesuai";
            alertpassword.style.display = 'block';
            submit_button.disabled = true
          } else {
            alertpassword.style.display = 'none';
            submit_button.disabled = false
          }
        }
       


    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
