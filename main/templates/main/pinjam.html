<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>{% block tittle %}{% endblock tittle %}</title>
</head>
<body>
    <div>
        <div class="container-fluid text-dark bg-dark">
            <div class="row vh-100">
         
                <div class="col-11 col-sm-10 col-md-8 col-lg-6 bg-light m-auto border border-light rounded-5 p-4 border-2">
                    <form action="" method="post">
                        <h1>Sign in:</h1>
        
                        {% if messages %}
                            
                                
                            {% for message in messages %}
                                <div class="{{ message.tags }}">{{ message }}</div>
                            {% endfor %}
                                    
                            
                        {% endif %}
        
                        <div class="mb-3">
                            <label class="form-label" for="username">Username :</label>
                            <input class="form-control" type="text" name="username" id="username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password :</label>
                            <input class="form-control" type="password" name="password" id="password">
                        </div>
                        <div class="mb-3">
                            <button class="btn btn-primary" type="submit">Login</button>
                        </div>
                        <div>
                            <p>
                                if you dont have an account <a href="{% url 'register' %}">click here to sign up</a>
                            </p>
                        </div>
                    </form>
                </div>
         
            </div>
        </div>
     </div>
</body>
