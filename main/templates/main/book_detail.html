{% extends 'main/base.html' %}
{% block title %}
    Homepage
{% endblock title %}
{% block content %}

{% include 'main/navbar.html' %}

<div class="container mt-2">
    <div class="row">
        <div class="col-4">
            <img class="img-fluid" src="{{book.cover_image.url}}" alt="">
        </div>
        <div class="col-4">
            <H1>{{book.title}}</H1>
            <ul>
                <li>Author : {{book.author}}</li>
                <li>Published Date : {{book.published_date}}</li>
                <li>Created At : {{book.created_at}}</li>
            </ul>
        </div>
        <div class="col-4">
            <img src="https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl={{book.code}}&choe=UTF-8" alt="">
        </div>
    </div>
</div>

{% endblock content %}
